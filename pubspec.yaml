name: darsh_store
description: A new Flutter project for Darsh Store.

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  riverpod: ^2.4.9
  web_socket_channel: ^2.4.0
  google_fonts: ^8.1.0
  flutter_secure_storage: ^9.0.0
  glassmorphism: ^3.0.0
  dio: ^5.3.3
  google_sign_in: ^6.1.5
  cupertino_icons: ^1.0.2
  video_player: ^2.10.1
  sign_in_button: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

